<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sixt Exotic Finder | Discover Guaranteed Supercars</title>
  <meta name="description" content="Find guaranteed exotic and supercar rentals at Sixt stations worldwide. Map + listings for car enthusiasts planning their next drive.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  
  <style>
    :root {
      --map-bg: #1a1a2e;
    }
    
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      color: white;
    }
    
    .glass {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    
    .glass-strong {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    
    .glass-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #a78bfa 0%, #fbbf24 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    #map {
      height: 100%;
      min-height: 500px;
      border-radius: 1rem;
      z-index: 1;
    }
    
    .leaflet-popup-content-wrapper {
      background: rgba(20, 20, 35, 0.95) !important;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px !important;
      color: white;
    }
    
    .leaflet-popup-tip {
      background: rgba(20, 20, 35, 0.95) !important;
    }
    
    .marker-exotic {
      background: linear-gradient(135deg, #10b981, #059669);
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
    }
    
    .marker-none {
      background: linear-gradient(135deg, #6b7280, #4b5563);
      border: 3px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      opacity: 0.7;
    }
    
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    .animate-pulse-slow {
      animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .animate-float {
      animation: float 6s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="glass-strong fixed top-0 left-0 right-0 z-50 px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-amber-500 flex items-center justify-center text-xl font-bold">
          🏎️
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">Sixt <span class="gradient-text">Exotic</span> Finder</h1>
          <p class="text-xs text-white/50">Guaranteed supercars worldwide</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button id="view-map" class="px-4 py-2 rounded-xl text-sm font-medium bg-white/20 hover:bg-white/30 transition-all active">
          🗺️ Map
        </button>
        <button id="view-list" class="px-4 py-2 rounded-xl text-sm font-medium hover:bg-white/10 transition-all text-white/70">
          📋 List
        </button>
      </div>
    </div>
  </header>

  <!-- Stats Bar -->
  <div class="pt-20 px-4">
    <div class="max-w-7xl mx-auto">
      <div class="glass rounded-2xl p-4 flex flex-wrap gap-4 justify-center items-center">
        <div class="text-center px-4">
          <div id="stat-stations" class="text-2xl font-bold text-purple-400">-</div>
          <div class="text-xs text-white/50 uppercase tracking-wider">Stations</div>
        </div>
        <div class="w-px h-8 bg-white/10"></div>
        <div class="text-center px-4">
          <div id="stat-exotics" class="text-2xl font-bold text-amber-400">-</div>
          <div class="text-xs text-white/50 uppercase tracking-wider">With Exotics</div>
        </div>
        <div class="w-px h-8 bg-white/10"></div>
        <div class="text-center px-4">
          <div id="stat-cars" class="text-2xl font-bold text-emerald-400">-</div>
          <div class="text-xs text-white/50 uppercase tracking-wider">Supercars</div>
        </div>
        <div class="w-px h-8 bg-white/10"></div>
        <div class="text-center px-4">
          <div id="stat-guaranteed" class="text-2xl font-bold text-pink-400">-</div>
          <div class="text-xs text-white/50 uppercase tracking-wider">Guaranteed</div>
        </div>
        <div class="w-px h-8 bg-white/10"></div>
        <div class="text-center px-4">
          <div id="stat-lastupdate" class="text-sm font-medium text-white/70">-</div>
          <div class="text-xs text-white/50 uppercase tracking-wider">Last Update</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="px-4 mt-4">
    <div class="max-w-7xl mx-auto flex flex-wrap gap-2 items-center">
      <span class="text-sm text-white/50 mr-2">Filter:</span>
      <select id="filter-country" class="glass rounded-lg px-3 py-2 text-sm text-white bg-transparent focus:outline-none focus:ring-2 focus:ring-purple-500/50">
        <option value="">All Countries</option>
      </select>
      <select id="filter-brand" class="glass rounded-lg px-3 py-2 text-sm text-white bg-transparent focus:outline-none focus:ring-2 focus:ring-purple-500/50">
        <option value="">All Brands</option>
      </select>
      <label class="flex items-center gap-2 glass rounded-lg px-3 py-2 text-sm cursor-pointer hover:bg-white/10 transition-all">
        <input type="checkbox" id="filter-guaranteed" class="w-4 h-4 rounded accent-purple-500">
        <span>Guaranteed Only</span>
      </label>
      <div class="flex-1"></div>
      <input type="text" id="search-input" placeholder="Search station or city..." 
        class="glass rounded-lg px-4 py-2 text-sm text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-purple-500/50 w-full sm:w-64">
    </div>
  </div>

  <!-- Main Content -->
  <main class="px-4 py-4 pb-20">
    <div class="max-w-7xl mx-auto">
      
      <!-- Map View -->
      <div id="map-view" class="h-[calc(100vh-280px)] min-h-[500px]">
        <div class="glass rounded-2xl h-full p-1">
          <div id="map"></div>
        </div>
      </div>
      
      <!-- List View -->
      <div id="list-view" class="hidden">
        <div id="stations-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <!-- Stations injected here -->
        </div>
        
        <div id="cars-section" class="mt-8">
          <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
            <span class="gradient-text">All Exotic Cars</span>
            <span id="cars-count" class="text-sm text-white/50 font-normal"></span>
          </h2>
          <div id="cars-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Cars injected here -->
          </div>
        </div>
      </div>
      
    </div>
  </main>

  <!-- Footer -->
  <footer class="fixed bottom-0 left-0 right-0 glass-strong px-4 py-2 z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between text-xs text-white/40">
      <span>Not affiliated with Sixt SE. Data refreshed weekly.</span>
      <a href="https://github.com/macmagic-ai/sixt-exotic-finder" target="_blank" class="hover:text-white/70 transition-colors">
        Open Source on GitHub
      </a>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
