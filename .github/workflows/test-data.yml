name: Data Quality Test

on:
  push:
    paths:
      - 'data/**'
  pull_request:
    paths:
      - 'data/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run data quality tests
        run: node scripts/test-data.js
